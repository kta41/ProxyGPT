name: Validate ProxyGPT GitOps

on:
  pull_request:
    paths:
      - ".github/workflows/validate-ai-config.yml"
      - "deploy/**"
      - "Infrastructure/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
  push:
    branches: [main, "feat/**"]
    paths:
      - ".github/workflows/validate-ai-config.yml"
      - "deploy/**"
      - "Infrastructure/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Validate shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/sync-openwebui-config.sh
          bash -n scripts/validate-manifests.sh

      - name: Validate YAML and render Kustomize overlays
        run: bash scripts/validate-manifests.sh

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: IaC and config scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
