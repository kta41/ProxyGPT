apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      values: |
        admissionController:
          replicas: 1
          # RenewDeadline = 5x retryPeriod (default 2s -> 10s, muy justo cuando el
          # API server de WSL2 sufre picos de latencia y el controller renuncia al
          # liderazgo y se reinicia). Con 6s -> 30s de margen.
          extraArgs:
            leaderElectionRetryPeriod: 6s
        backgroundController:
          replicas: 1
          extraArgs:
            leaderElectionRetryPeriod: 6s
        cleanupController:
          replicas: 1
          extraArgs:
            leaderElectionRetryPeriod: 6s
        reportsController:
          replicas: 1
          extraArgs:
            leaderElectionRetryPeriod: 6s
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        # El chart renderiza maps vacios (annotations/labels: {}) que el objeto
        # vivo no tiene, y el API server re-defaultea spec.conversion -> diff perpetuo.
        - /metadata/annotations
        - /metadata/labels
        - /spec/conversion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
