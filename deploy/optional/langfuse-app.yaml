apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://langfuse.github.io/langfuse-k8s
    chart: langfuse
    targetRevision: 2.1.3
    helm:
      releaseName: langfuse
      values: |
        langfuse:
          features:
            signUpDisabled: true
            telemetryEnabled: false
          ingress:
            enabled: false
          serviceAccount:
            automountServiceAccountToken: false
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
