apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rag-client-to-qdrant
spec:
  podSelector:
    matchLabels:
      app: rag-qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-client
        - podSelector:
            matchLabels:
              app: open-webui
      ports:
        - protocol: TCP
          port: 6333
